name: Build NEBULA HUB PKG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 binutils make curl ca-certificates imagemagick fonts-dejavu-core dotnet-sdk-8.0
      - name: Download and verify OpenOrbis and SDL_ttf
        run: bash scripts/bootstrap-sdk.sh
      - name: Build ELF, FSELF and PKG
        run: make -j"$(nproc)"
      - name: Validate and extract PKG
        run: |
          make verify
          sha256sum nebulahub.pkg > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nebulahub-pkg
          path: |
            nebulahub.pkg
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
